name: Refresh project RAG index

on:
  workflow_dispatch:
  repository_dispatch:
    types: [project-repository-updated]
  schedule:
    - cron: "23 4 * * 1"
  push:
    branches: [main]
    paths:
      - "public/data/rag-knowledge-base.json"
      - "tools/rag/**"
      - "package.json"
      - ".github/workflows/rag-project-index.yml"

permissions:
  contents: read

concurrency:
  group: rag-project-index-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out CV repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install CV tooling
        run: npm ci

      - name: Rebuild compatibility data
        run: npm run rag:build

      - name: Index linked project repositories
        run: npm run rag:index-projects

      - name: Validate factual and security constraints
        run: npm run rag:validate

      - name: Test retrieval behavior
        run: npm run rag:test

      - name: Upload generated RAG review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-rag-index
          path: |
            public/profile.json
            public/rag/project-code-index.json
            public/rag/project-index-report.json
            public/rag/projects

      - name: Verify checked-in RAG files are current
        run: |
          if ! git diff --exit-code -- public/profile.json public/rag/project-code-index.json public/rag/project-index-report.json public/rag/projects; then
            echo "::error title=Mise à jour RAG requise::Des différences ont été détectées entre vos projets et l'index RAG du chatbot."
            echo "## ⚠️ Action requise : Mise à jour de l'index RAG" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Des modifications récentes dans vos dépôts ou votre CV ne sont pas encore enregistrées dans l'index du chatbot." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Que devez-vous faire ?" >> $GITHUB_STEP_SUMMARY
            echo "1. Téléchargez l'artéfact **\`project-rag-index\`** généré dans ce run (qui contient déjà tous les fichiers mis à jour et validés)." >> $GITHUB_STEP_SUMMARY
            echo "2. Décompressez-le et remplacez les fichiers dans votre projet local." >> $GITHUB_STEP_SUMMARY
            echo "3. Committez et poussez les changements sur GitHub :" >> $GITHUB_STEP_SUMMARY
            echo "   \`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "   git add public/profile.json public/rag/" >> $GITHUB_STEP_SUMMARY
            echo "   git commit -m 'chore(rag): update chatbot index'" >> $GITHUB_STEP_SUMMARY
            echo "   # puis envoyez les modifications sur GitHub (push)" >> $GITHUB_STEP_SUMMARY
            echo "   \`\`\`" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

